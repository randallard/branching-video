# One workflow, both language paths. `detect` looks for Cargo.toml / package.json
# and the language jobs skip themselves when their manifest isn't there — so a
# TS-only or Rust-only project needs no edits, and a project that grows a second
# language needs none either.
#
# EVERY third-party action is pinned to a full-length commit SHA, not a tag.
# Tags are mutable: the tj-actions/changed-files compromise (CVE-2025-30066)
# worked by repointing existing version tags at a malicious commit, and GitHub's
# own guidance calls a SHA "the only way to use an action as an immutable
# release". The trailing comment records the human-readable version — keep it
# accurate when you bump, since the SHA alone tells you nothing.
#
# Note dtolnay/rust-toolchain@stable is a *branch*, which moves by design — the
# pin matters most there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    name: detect languages
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      ts: ${{ steps.d.outputs.ts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: d
        run: |
          set -euo pipefail
          rust=false; ts=false
          [ -f Cargo.toml ] && rust=true
          [ -f package.json ] && ts=true
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "ts=$ts" >> "$GITHUB_OUTPUT"
          echo "rust=$rust ts=$ts"

  # ── Rust ────────────────────────────────────────────────────────────────────
  rust-gates:
    name: rust fast gates
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (branch!)
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-features

  rust-proofs:
    name: rust proofs (kani)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Deliberately its own job: a slow or cranky proof run must never delay the
    # fast-gate feedback loop, and a separate check name says at a glance which
    # tier failed. Runs on every push — no paths filter, no schedule.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          # Point this at the pure core crate. Kani needs zero annotations to
          # give you panic-freedom, so this earns its place from day one.
          args: --workspace

  rust-supply-chain:
    name: rust supply chain
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses bans sources advisories

  # ── TypeScript ──────────────────────────────────────────────────────────────
  ts-gates:
    name: ts fast gates
    needs: detect
    if: needs.detect.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: vars.DEPLOY_PAGES == 'true'
        with:
          path: dist

  ts-supply-chain:
    name: ts supply chain
    needs: detect
    if: needs.detect.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: known-vulnerability audit
        run: pnpm audit --audit-level=high
      - name: signatures + provenance
        # A different question from the audit above: that one asks "is this
        # version on a known-bad list", this asks "was this tarball actually
        # published by who the registry says, and built where it claims".
        run: pnpm audit signatures
      - name: license allowlist
        run: >
          pnpm exec license-checker-rseidelsohn
          --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Python-2.0;BlueOak-1.0.0;MPL-2.0;CC-BY-3.0"
          --excludePrivatePackages

  # ADR-0027: the Playwright suite in e2e/, against the built site under `vite preview`. Hermetic —
  # YouTube is faked and every off-origin request is blocked — so a red run is our bug, never
  # YouTube's. No retries, on purpose: a flake is a bug in a test or the fake, not noise.
  e2e:
    name: e2e (playwright)
    needs: detect
    if: needs.detect.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # An explicit, version-pinned download from Playwright's CDN — nothing is fetched at install
      # time (ADR-0012). The browser runs tests only and never ships, so it's outside the SBOM.
      - name: install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # ── Shared ──────────────────────────────────────────────────────────────────
  sbom:
    name: SBOM
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Name the subject of the SBOM. Without this `metadata.component` is
      # {"type":"file","name":"."} and the document never says what it describes,
      # which makes it close to useless to anyone who receives it on its own.
      # Syft reads these two from the environment.
      - name: identify the SBOM subject
        if: needs.detect.outputs.ts == 'true'
        run: |
          set -euo pipefail
          {
            echo "SYFT_SOURCE_NAME=$(jq -er .name package.json)"
            echo "SYFT_SOURCE_VERSION=$(jq -er .version package.json)"
          } >> "$GITHUB_ENV"
      # Syft scans the project directly — a single static binary, no npm or cargo
      # dependency of its own, so it sidesteps package-manager layout problems.
      #
      # This catalogs `pnpm-lock.yaml`, NOT `node_modules`, and that is deliberate:
      # the lockfile is the complete, platform-independent, reproducible set (it
      # includes the native binaries for every OS, which a Linux install omits).
      # The cost is that the lockfile carries no licence metadata, so no component
      # here has a `licenses` field. Do not "fix" that by installing first and
      # enabling `javascript-package-cataloger` — measured 2026-09-17, that yields
      # 548 components for 285 packages (every one duplicated, once per cataloger)
      # and picks up whatever stale trees are lying in the pnpm store. The licence
      # control is ADR-0017's allowlist in the `ts supply chain` job, which reads a
      # real install and gates on it; this document is an inventory, not a licence
      # report.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      # A cataloger that silently stops matching produces an empty SBOM, and an
      # empty SBOM uploads and goes green — the job would keep reporting success
      # while the artifact became worthless. 50 is a floor, not a target: the real
      # count is in the hundreds, and anything near this number means something
      # stopped working.
      - name: SBOM is not empty
        run: |
          set -euo pipefail
          count=$(jq '.components | length' sbom.cdx.json)
          subject=$(jq -r '.metadata.component | "\(.name)@\(.version // "?")"' sbom.cdx.json)
          echo "SBOM subject: $subject — $count components"
          if [ "$count" -lt 50 ]; then
            echo "::error::SBOM has only $count components; a cataloger has probably stopped matching."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.cdx.json

  osv-scan:
    name: OSV scan
    needs: detect
    # Only when there's a dependency manifest to scan. Without this the template
    # repo itself — which has no Cargo.toml or package.json — goes red on a scan
    # of nothing, and a template whose own CI is failing teaches the wrong thing.
    if: needs.detect.outputs.rust == 'true' || needs.detect.outputs.ts == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    # A reusable workflow, and `uses:` resolves a ref in that repo the same way an
    # action does — so ADR-0018 applies here too and it is pinned to a SHA, with
    # the version in the trailing comment. Bump deliberately.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8

  deploy:
    name: deploy to Pages
    # `osv-scan` is in here because after ADR-0006 the job that builds `dist/` is
    # the job that publishes what viewers load — the same reasoning ADR-0018 gives
    # for pinning actions. A red scanner must not be able to ship. (`osv-scan`
    # skips itself only when there is no dependency manifest at all, which cannot
    # be true of a project deploying a built site.) `e2e` is in here per ADR-0027:
    # a site whose pages are broken in a browser must not publish either.
    needs: [ts-gates, ts-supply-chain, osv-scan, e2e]
    # Opt in per project: Settings → Variables → DEPLOY_PAGES = true.
    # Remember `base` must match the repo name or every asset 404s.
    if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
