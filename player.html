<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com; frame-src https://www.youtube.com; img-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Loading…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --border: #222;
      --text: #f0f0f0;
      --muted: #888;
      --accent: #e8e8e8;
      --aside-indicator: #f59e0b;
      --btn-primary-bg: rgba(240,240,240,0.92);
      --btn-primary-fg: #0a0a0a;
      --btn-secondary-bg: rgba(20,20,20,0.85);
      --btn-secondary-fg: #f0f0f0;
      --btn-secondary-border: rgba(240,240,240,0.35);
      --btn-skip-bg: rgba(245,158,11,0.15);
      --btn-skip-border: rgba(245,158,11,0.5);
      --btn-skip-fg: #f59e0b;
      --btn-back-bg: rgba(240,240,240,0.15);
      --btn-back-border: rgba(240,240,240,0.4);
      --btn-back-fg: #f0f0f0;
      --radius: 6px;
      --transition: 220ms ease;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      min-height: 44px;
      flex-shrink: 0;
    }

    #menu-toggle {
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 10px;
      margin-left: -8px;
      border-radius: var(--radius);
      transition: background var(--transition);
      line-height: 1;
    }

    #menu-toggle:hover { background: rgba(255,255,255,0.08); }

    /* ── Chapter menu ── */
    #menu {
      position: fixed;
      inset: 0;
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(8px);
      z-index: 40;
      display: none;
      flex-direction: column;
    }
    #menu.visible { display: flex; }

    #menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    #menu-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    #menu-close {
      background: none;
      border: none;
      color: var(--text);
      font-size: 26px;
      cursor: pointer;
      padding: 0 8px;
      line-height: 1;
    }
    #menu-close:hover { color: var(--muted); }

    #menu-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      background: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: background var(--transition);
    }
    .menu-item:hover { background: rgba(255,255,255,0.06); }
    .menu-item.current {
      background: rgba(245,158,11,0.08);
      border-left: 3px solid var(--aside-indicator);
      padding-left: 13px;
    }
    .menu-item-title { flex: 1; }
    .menu-item-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 4px;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);
      color: var(--aside-indicator);
    }

    #show-title {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    #node-title {
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
    }

    #aside-badge {
      display: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--aside-indicator);
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 4px;
      padding: 2px 7px;
    }

    #aside-badge.visible { display: inline-block; }

    /* ── Player wrapper ── */
    #player-wrap {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
    }

    #yt-player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* YouTube iframe needs explicit sizing */
    #yt-player iframe {
      width: 100%;
      height: 100%;
    }

    /* ── Overlay ── */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 24px;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }

    /* Skip button (Pattern B — always visible during default aside) */
    #skip-btn {
      display: none;
      pointer-events: all;
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--btn-skip-bg);
      border: 1px solid var(--btn-skip-border);
      color: var(--btn-skip-fg);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      letter-spacing: 0.02em;
    }

    #skip-btn:hover {
      background: rgba(245,158,11,0.25);
      border-color: rgba(245,158,11,0.7);
    }

    #skip-btn.visible { display: block; }

    /* Back button — return to the moment of branching */
    #back-btn {
      display: none;
      pointer-events: all;
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--btn-back-bg);
      border: 1px solid var(--btn-back-border);
      color: var(--btn-back-fg);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
    }

    #back-btn:hover {
      background: rgba(240,240,240,0.25);
      border-color: rgba(240,240,240,0.6);
    }

    #back-btn.visible { display: block; }

    /* Choice buttons container */
    #choices {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 520px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 350ms ease, transform 350ms ease;
    }

    #choices.visible {
      pointer-events: all;
      opacity: 1;
      transform: translateY(0);
    }

    /* Countdown bar */
    #countdown-wrap {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    #countdown-bar {
      height: 100%;
      width: 100%;
      background: rgba(255,255,255,0.5);
      transform-origin: left;
      transition: transform linear;
    }

    .choice-btn {
      width: 100%;
      padding: 13px 20px;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
      text-align: center;
      letter-spacing: 0.01em;
      line-height: 1.3;
    }

    .choice-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .choice-btn:active { transform: translateY(0); }

    .choice-btn.primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
    }

    .choice-btn.secondary {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-fg);
      border-color: var(--btn-secondary-border);
      backdrop-filter: blur(8px);
    }

    /* ── End screen ── */
    #end-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: var(--bg);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px;
      text-align: center;
      z-index: 20;
    }

    #end-screen.visible { display: flex; }

    #end-heading {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    #end-body {
      font-size: 16px;
      color: var(--muted);
      max-width: 480px;
      line-height: 1.6;
    }

    #end-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }

    .end-link-btn {
      padding: 12px 20px;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: transform var(--transition);
    }

    .end-link-btn:hover { transform: translateY(-1px); }
    .end-link-btn:first-child { background: var(--btn-primary-bg); color: var(--btn-primary-fg); }
    .end-link-btn:not(:first-child) {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-fg);
      border: 1px solid var(--btn-secondary-border);
    }

    /* ── Error / loading states ── */
    #status {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-size: 15px;
      color: var(--muted);
      z-index: 30;
      text-align: center;
      padding: 24px;
    }

    #status.visible { display: flex; }

    #menu-footer {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }
    .menu-index-link {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 14px 16px;
      border: none;
      background: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--transition), color var(--transition);
    }
    .menu-index-link:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  </style>
</head>
<body>

<div id="app">
  <header id="header">
    <button id="menu-toggle" aria-label="Open chapter menu" aria-expanded="false" aria-controls="menu">☰</button>
    <span id="show-title">Loading…</span>
    <span id="node-title"></span>
    <span id="aside-badge">Deep dive</span>
  </header>

  <nav id="menu" aria-label="Chapters" aria-hidden="true">
    <div id="menu-header">
      <span id="menu-title">Chapters</span>
      <button id="menu-close" aria-label="Close chapter menu">×</button>
    </div>
    <ul id="menu-list"></ul>
    <div id="menu-footer">
      <a href="index.html" class="menu-index-link" id="menu-index-link">&#8592; All shows</a>
    </div>
  </nav>

  <div id="player-wrap">
    <div id="yt-player"></div>

    <div id="overlay">
      <button id="skip-btn" aria-label="Skip aside and return to main line"></button>
      <button id="back-btn" aria-label="Return to where you branched from"></button>
      <div id="choices" role="group" aria-label="Choose where to go next">
        <div id="countdown-wrap" aria-hidden="true">
          <div id="countdown-bar"></div>
        </div>
      </div>
    </div>

    <div id="end-screen" role="region" aria-label="End of video">
      <div id="end-heading"></div>
      <div id="end-body"></div>
      <div id="end-links"></div>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </div>
</div>

<script type="module" src="/src/pages/player.ts"></script>

</body>
</html>
