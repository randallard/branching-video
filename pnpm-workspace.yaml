# Supply-chain gates. Every setting here is decided by an ADR — cite it when changing one.

# ADR-0012: native build scripts are blocked by default; any exception is listed and reviewed
# individually, never blanket-approved. None needed today.
onlyBuiltDependencies: []

# ADR-0030 (supersedes ADR-0014): quarantine new releases for 1 day (in minutes), matched to
# renovate.json's minimumReleaseAge. This gates every install, including a manual `pnpm add`;
# the Renovate setting only paces Renovate's own PRs.
minimumReleaseAge: 1440

# ADR-0014: fail the install when a package's trust evidence decreases versus prior releases.
trustPolicy: no-downgrade

# ADR-0014: transitive dependencies resolve from the registry only — no git URLs or tarballs.
blockExoticSubdeps: true

# Transitive advisories (all reached through dev tooling: license-checker, eslint, vite).
# Scoped to the major already in the lockfile so an override can't jump a major version.
overrides:
  "undici@6": "^6.28.1" # GHSA-rfgv-xxqx-mfg5, GHSA-3wwx-pv8p-q78v, GHSA-r53p-7pc4-xj5r
  "brace-expansion@5": "^5.0.12" # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr
  "source-map-js": "^1.2.2" # GHSA-68fv-2mgg-jv7q
  "http-cache-semantics": "^4.2.1" # GHSA-ch52-4w7c-c8xp
  "ip-address": "^10.7.1" # GHSA-h3mg-xc3c-68pw, GHSA-j6r3-76f7-8jcv
  "postcss-selector-parser@7": "^7.1.6" # GHSA-rj75-hqrm-r3gf
